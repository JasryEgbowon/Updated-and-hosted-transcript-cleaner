<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transcript Cleaner</title>
<style>
:root {
  --bg: #f4f6fa; --panel: #ffffff; --ink: #14213d; --muted: #5b6478;
  --line: #d5dbe7; --accent: #3b4cca; --accent-ink: #ffffff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f; --panel: #1a2030; --ink: #e8ecf5; --muted: #9aa4ba;
    --line: #2b3348; --accent: #8e9bff; --accent-ink: #11151f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f; --panel: #1a2030; --ink: #e8ecf5; --muted: #9aa4ba;
  --line: #2b3348; --accent: #8e9bff; --accent-ink: #11151f; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; line-height: 1.5;
}
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; max-width: 60ch; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; }
.box.drag { border-color: var(--accent); outline: 2px dashed var(--accent); }
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.head h2 { font-size: 1rem; margin: 0; }
textarea {
  width: 100%; min-height: 380px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
  background: transparent; color: var(--ink); padding: 10px; font: 0.92rem/1.5 Consolas, "Courier New", monospace;
}
textarea:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button {
  font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); padding: 6px 12px;
}
button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opts { margin: 14px 0 0; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.count { color: var(--muted); font-size: 0.85rem; }
footer { margin-top: 20px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Transcript Cleaner</h1>
  <p class="sub">Paste the text from a .vtt caption file and the timestamps disappear right away. Nothing is uploaded, it all happens in your browser.</p>

  <div class="grid">
    <section class="box" id="inBox">
      <div class="head">
        <h2>Paste VTT text</h2>
        <div class="row">
          <button type="button" id="openBtn">Open .vtt file</button>
          <button type="button" id="clearBtn">Clear</button>
        </div>
      </div>
      <textarea id="input" placeholder="Paste here, or drop a .vtt or .txt file onto this box" spellcheck="false"></textarea>
      <input type="file" id="fileInput" accept=".vtt,.txt,.srt" hidden>
    </section>

    <section class="box">
      <div class="head">
        <h2>Cleaned text</h2>
        <div class="row">
          <span class="count" id="count">0 lines</span>
          <button type="button" class="main" id="copyBtn">Copy cleaned text</button>
        </div>
      </div>
      <textarea id="output" readonly placeholder="Your cleaned transcript shows up here"></textarea>
    </section>
  </div>

  <div class="opts">
    <label><input type="checkbox" id="dedupe" checked> Remove repeated lines</label>
    <label><input type="checkbox" id="tags" checked> Remove caption tags</label>
  </div>

  <footer>Tip: in the network tab, click the caption request, copy the whole response and paste it here.</footer>
</main>

<script>
// grab all the elements we need
const input = document.getElementById("input");
const output = document.getElementById("output");
const count = document.getElementById("count");
const dedupe = document.getElementById("dedupe");
const tags = document.getElementById("tags");
const copyBtn = document.getElementById("copyBtn");
const fileInput = document.getElementById("fileInput");
const inBox = document.getElementById("inBox");

// matches lines like 00:00:18.015 --> 00:00:19.145 (hours optional, comma allowed for srt)
const timePattern = /^\s*(\d{1,2}:)?\d{2}:\d{2}[.,]\d{3}\s*-->\s*(\d{1,2}:)?\d{2}:\d{2}[.,]\d{3}.*$/;
// header and metadata lines we don't want in the notes
const junkPattern = /^(WEBVTT|NOTE|STYLE|REGION|Kind:|Language:)/i;

function cleanText(raw) {
  const lines = raw.split(/\r?\n/);
  const kept = [];

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();

    if (!line) continue;                          // empty line
    if (/^\d+$/.test(line)) continue;             // sequence number
    if (timePattern.test(line)) continue;         // timestamp line
    if (junkPattern.test(line)) continue;         // header or metadata

    // cue ids (like "cue-1") sit right above a timestamp line, so skip those too
    if (i + 1 < lines.length && timePattern.test(lines[i + 1])) continue;

    if (tags.checked) {
      line = line.replace(/<[^>]+>/g, "");        // things like <c> or <00:00:01.000>
    }
    line = line.replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").trim();
    if (!line) continue;

    // auto captions repeat lines a lot, so skip it if it matches the last one
    if (dedupe.checked && kept.length && kept[kept.length - 1] === line) continue;

    kept.push(line);
  }
  return kept;
}

function update() {
  const result = cleanText(input.value);
  output.value = result.join("\n");
  count.textContent = result.length + (result.length === 1 ? " line" : " lines");
}

input.addEventListener("input", update);
dedupe.addEventListener("change", update);
tags.addEventListener("change", update);

document.getElementById("clearBtn").addEventListener("click", () => {
  input.value = "";
  update();
  input.focus();
});

copyBtn.addEventListener("click", async () => {
  if (!output.value) return;
  try {
    await navigator.clipboard.writeText(output.value);
  } catch (e) {
    // fallback for browsers that block the clipboard api
    output.select();
    document.execCommand("copy");
  }
  copyBtn.textContent = "Copied";
  setTimeout(() => { copyBtn.textContent = "Copy cleaned text"; }, 1500);
});

// load a file into the input box
async function loadFile(file) {
  if (!file) return;
  input.value = await file.text();
  update();
}

document.getElementById("openBtn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { loadFile(fileInput.files[0]); fileInput.value = ""; });

// drag and drop
["dragenter", "dragover"].forEach(ev => inBox.addEventListener(ev, e => { e.preventDefault(); inBox.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => inBox.addEventListener(ev, e => { e.preventDefault(); inBox.classList.remove("drag"); }));
inBox.addEventListener("drop", e => loadFile(e.dataTransfer.files[0]));
</script>
</body>
</html>
